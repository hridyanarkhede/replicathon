<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicathon1</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main>
        <nav>
            <div class="logo">
                <img src="./assets/logo.png" alt="">
            </div>

            <div class="nav-right">
                <div class="nav-links">
                    <p>Home</p>
                    <p>Products</p>
                    <p>Contact</p>
                </div>

                <button class="order-button">
                    <p>Place order</p>
                    <img src="./assets/placeOrder.svg" alt="">
                </button>
            </div>

        </nav>

        <div class="options">
            <button id="products">Products</button>
            <button id="custom">Custom</button>
        </div>

        <section>
            <div class="mleft">
                <h1>Find Your Greatness</h1>
                <p >Build for speed and confidence, <br> every pair combaines premium <br> materials and bold designs. <br> Engineered for comfort, made for movement. </p>
            </div>

            <div class="middle">
                <p>hy.pe</p>
                
            </div>

            <div class="shoe">
                <img src="./assets/shoe.png" alt="">
            </div>

            <div class="mright">
                <p>Choose Your Color</p>

                <div class="buttons">
                    <button id="blue"></button>
                    <button id="orange"></button>
                    <button id="red"></button>
                </div>

                <div class="sizes">
                    <button id="s1">40</button>
                    <button id="s2">42</button>
                    <button id="s3">44</button>
                </div>

            </div>
        </section>

        <footer>
            <div class="bleft">
                <img src="./assets/instagram.svg" alt="">
                <img src="./assets/facebook.svg" alt="">
                <img src="./assets/pinterest.svg" alt="">
                <img src="./assets/youtube.svg" alt="">
                
            </div>

            <div class="tagline">
                <span class="line"></span>
                <p>sneakers for more</p>
                <span class="line"></span>
            </div>

            <button class="visit">
                <p>See all products</p>
                <img src="./assets/arrow.svg" alt="">
            </button>

        </footer>

        
    </main>
</body>
</html>
